<line x1="242.3" y1="289.7" x2="220.0" y2="240.2" stroke="#f85149" stroke-width="1.5"/>
<text x="214.0" y="245.2" font-size="15" fill="#f85149" text-anchor="end" font-weight="bold">J8 ‘JTAG’ USB-C</text>
<text x="214.0" y="262.2" font-size="13" fill="#e6edf3" text-anchor="end">5 V in, 2 A+ USB-A charger</text>
<text x="214.0" y="279.2" font-size="13" fill="#e6edf3" text-anchor="end">A-to-C cable (not C-to-C)</text>
<text x="214.0" y="296.2" font-size="13" fill="#8b949e" text-anchor="end">(also the JTAG programmer)</text>
<line x1="242.3" y1="384.9" x2="220.0" y2="393.4" stroke="#8b949e" stroke-width="1.5"/>
<text x="214.0" y="398.4" font-size="15" fill="#e6edf3" text-anchor="end" font-weight="bold">J2 ‘UART’ USB-C</text>
<text x="214.0" y="415.4" font-size="13" fill="#8b949e" text-anchor="end">console to the PC (A-to-C)</text>
<text x="214.0" y="432.4" font-size="13" fill="#8b949e" text-anchor="end">(watch_boot.ps1)</text>
<line x1="240.9" y1="513.7" x2="220.0" y2="543.7" stroke="#58a6ff" stroke-width="1.5"/>
<text x="214.0" y="548.7" font-size="15" fill="#58a6ff" text-anchor="end" font-weight="bold">HDMI → monitor</text>
<text x="214.0" y="565.7" font-size="13" fill="#e6edf3" text-anchor="end">the GPU: 1280×720 @ 60</text>
<line x1="896.1" y1="373.3" x2="920.0" y2="342.1" stroke="#3fb950" stroke-width="1.5"/>
<text x="926.0" y="347.1" font-size="15" fill="#3fb950" text-anchor="start" font-weight="bold">ETH-PS → Orange Pi</text>
<text x="926.0" y="364.1" font-size="13" fill="#e6edf3" text-anchor="start">eth0: 10.20.0.2 + 10.77.0.2</text>
<text x="926.0" y="381.1" font-size="13" fill="#8b949e" text-anchor="start">GPU 7777 • engine 8093</text>
<text x="926.0" y="398.1" font-size="13" fill="#8b949e" text-anchor="start">RAM (nbd) 10809</text>
<line x1="896.1" y1="503.5" x2="920.0" y2="523.5" stroke="#8b949e" stroke-width="1.5"/>
<text x="926.0" y="528.5" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="bold">ETH-PL</text>
<text x="926.0" y="545.5" font-size="13" fill="#8b949e" text-anchor="start">eth1, spare</text>
<line x1="896.1" y1="255.6" x2="920.0" y2="211.6" stroke="#8b949e" stroke-width="1.5"/>
<text x="926.0" y="216.6" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="bold">boot jumper (above USB-A):</text>
<text x="926.0" y="233.6" font-size="13" fill="#3fb950" text-anchor="start">cap on the SD pair</text>
<circle cx="60" cy="682" r="7" fill="#58a6ff"/><text x="74" y="687" font-size="15" fill="#e6edf3">Teensy data D0–D15 (Teensy pin T#)</text>
<circle cx="430" cy="682" r="7" fill="#f0883e"/><text x="444" y="687" font-size="15" fill="#e6edf3">SOR / STROBE / BUSY</text>
<circle cx="800" cy="682" r="7" fill="#8b949e"/><text x="814" y="687" font-size="15" fill="#e6edf3">GND</text>
<circle cx="60" cy="708" r="7" fill="#f85149"/><text x="74" y="713" font-size="15" fill="#e6edf3">5 V (fan only)</text>
<circle cx="430" cy="708" r="7" fill="#d2a8ff"/><text x="444" y="713" font-size="15" fill="#e6edf3">3.3 V — leave</text>
<circle cx="800" cy="708" r="7" fill="#3fb950"/><text x="814" y="713" font-size="15" fill="#e6edf3">fan PWM / tach</text>
<text x="60" y="751" font-size="14" fill="#8b949e">Only GND and the 19 signal wires join the Teensy and the FPGA (3.3 V both sides, no resistors).</text>
<text x="60" y="771" font-size="14" fill="#8b949e">Never wire JM1 pin 1 (5 V) or pin 2 (3.3 V) to the Teensy — it is powered by the Pi's USB.</text>
<text x="60" y="791" font-size="14" fill="#8b949e">Never power the board from J8 and JM1 pin 1 at the same time: they are one net.</text>
</svg>
