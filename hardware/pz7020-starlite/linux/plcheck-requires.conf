# Drop-in for every unit that reads the PL at boot (fpgagpud, zaccel-server, zynq-agent).
# zynq-plcheck decides whether the PL can be read without hanging the bus: FCLK0 running, the PS/PL level
# shifters on, the fabric out of reset. When it says BLOCKED, this unit does not start and the board
# stays up and reachable instead of freezing on its first PL read (what happened on 2026-10-05).
[Unit]
Requires=zynq-plcheck.service
After=zynq-plcheck.service
