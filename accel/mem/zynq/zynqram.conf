# /etc/nbd-server/conf.d/zynqram.conf -- the Zynq's DDR3 lent to the Orange Pi as swap (SPEC section 3).
# Read through "includedir = /etc/nbd-server/conf.d" in the package's /etc/nbd-server/config, whose
# [generic] section sets user/group nbd and leaves the port at the NBD default, TCP 10809.
# The file is a fully allocated tmpfs file made at boot by zynqram-prep.service; its size is the
# export size (ZACCEL_SWAP_MB in /etc/default/zynqram).
# timeout = 0: an idle connection is never dropped. Swap can sit idle for hours, and a dropped
# connection throws away every page the Pi has out here.
# Only the Pi's own links may attach: the car LAN (10.20.0.0/24), the GPU's direct cable (10.77.0.0/24),
# IPv4 link-local, this board itself, and QEMU's user-net host (10.0.2.2, the emulated test only).
# Without this, anyone on a shared bench LAN could read or write the Pi's swapped-out memory.
# To attach from another address, add it to /etc/nbd-server/zynqram.allow (one address or net/len per line).
[zynqram]
	authfile = /etc/nbd-server/zynqram.allow
	exportname = /run/zynqram/zynqram.img
	readonly = false
	copyonwrite = false
	timeout = 0
