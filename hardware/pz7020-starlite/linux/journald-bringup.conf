# /etc/systemd/journald.conf.d/bringup.conf -- board bring-up: write the journal to the card within 2 s
# instead of journald's default 5 minutes. On 2026-10-05 the board stopped somewhere between 8.0 and
# 13 s and its card held journal entries only up to 5.55 s, the moment of the journal flush; everything
# after was still in RAM. Remove once the board boots reliably (it costs a card write every 2 s).
[Journal]
SyncIntervalSec=2s
