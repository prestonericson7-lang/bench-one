<svg viewBox="0 0 1200 850" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">PZ7020-StarLite accelerator wiring</title>
<desc id="d">Top view of the PZ7020-StarLite (vendor PCB geometry) wired as the Orange Pi 4 Pro's accelerator: Teensy 4.1 geometry bus on JM1 pins 9-27 with grounds on 4 and 33-35, fan on JM1 pins 1/3/5/7, ETH-PS to the Orange Pi, HDMI to a monitor, JTAG USB-C for power, UART USB-C for the console, boot jumper on SD.</desc>
<rect width="1200" height="850" fill="#0d1117"/>
<text x="600.0" y="34" font-size="24" fill="#e6edf3" text-anchor="middle" font-weight="bold">PZ7020-StarLite — wired as the Orange Pi's accelerator</text>
<text x="600.0" y="58" font-size="14" fill="#8b949e" text-anchor="middle">top view, component side up • geometry from the vendor PCB drawing • JM1 signals from accel/gpu/WIRING.md</text>
