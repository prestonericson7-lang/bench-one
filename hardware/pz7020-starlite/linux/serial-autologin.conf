# /etc/systemd/system/serial-getty@ttyPS0.service.d/autologin.conf
# Same agetty line as Debian bookworm's serial-getty@.service (tty on stdin via "-"), plus --autologin root.
# The serial console logs in as root by itself, so the host watcher can run zynq-report without anyone
# typing a password. Reaching this console needs physical access to the board's UART port; SSH still
# requires the root password.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --keep-baud 115200,57600,38400,9600 - $TERM
